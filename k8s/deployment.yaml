apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-rescue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-rescue
  template:
    metadata:
      labels:
        app: food-rescue
    spec:
      containers:
        - name: food-rescue
          image: IMAGE_PLACEHOLDER   # replaced by Jenkins at deploy time
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
